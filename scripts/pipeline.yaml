@Library("shared") _
pipeline {
    agent any
   
    environment {
        Docker_Hub_user = 'prakashgautam1998'
        IMAGE_NAME = 'book-app'
        IMAGE_TAG = "${BUILD_NUMBER}"
        MANIFEST_FILE = 'k8s/deployment.yml'
        }

    stages {
        stage('Code') {
            steps {
                script{
                    clone('https://github.com/kumarprakash21/k8s-book-manager-app.git','main')
                }
            }
        }

        stage('Scan via Trivy'){
            steps {
                echo "Scan started by Trivy"
                sh 'trivy fs .'
                echo "Scan completed successfully"
            }
        }
        stage('Build') {
            steps {
                echo 'This is building the docker image'
                script{
                    docker_build(Docker_Hub_user,IMAGE_NAME,IMAGE_TAG)
                }
            }
        }
        stage('Scan Image via Trivy') {
            steps {
                sh '''
                trivy image \
                --severity HIGH,CRITICAL \
                --exit-code 1 \
                ${Docker_Hub_user}/${IMAGE_NAME}:${IMAGE_TAG}
                '''
            }
        }
        stage('Push') {
            steps { 
                withCredentials([
                    usernamePassword(credentialsId: 'dockerhub',
                        usernameVariable: 'DOCKER_USER',passwordVariable: 'DOCKER_PASS'
                    )]) {
                sh '''
            echo "Pushing image to docker hub"
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
            
            docker push ${Docker_Hub_user}/${IMAGE_NAME}:${IMAGE_TAG}
            '''
}
}
}

    }
}
